name: andesstay-kafka

# Cluster Kafka del caso (seccion 7): ensemble de 3 nodos Zookeeper + 3 brokers (sin KRaft),
# la creacion de los topicos del sistema con su configuracion (kafka-init) y Kafka UI para
# administrar brokers, topicos y consumer groups.
#
#   docker compose -f infra/kafka/compose.yml up -d
#
# Puertos en el host: brokers 9092/9093/9094, Zookeeper 2181/2182/2183, Kafka UI 8089.
# Los microservicios corriendo en el host usan KAFKA_BOOTSTRAP_SERVERS=localhost:9092,localhost:9093,localhost:9094
# (con uno solo basta para descubrir el cluster, pero listar los tres tolera que ese broker este caido).
#
# Memoria: ~3,5 GB en total (heap de 256 MB por Zookeeper y 512 MB por broker).

x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.6.1
  restart: unless-stopped
  environment: &zookeeper-env
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000
    ZOOKEEPER_INIT_LIMIT: 5
    ZOOKEEPER_SYNC_LIMIT: 2
    # Ensemble de 3 nodos: tolera la caida de 1 (quorum = 2).
    ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
  healthcheck:
    # "Mode: leader/follower" solo aparece cuando el nodo ya forma quorum con los otros.
    test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/2181 && echo srvr >&3 && cat <&3 | grep -q Mode"]
    interval: 10s
    timeout: 5s
    retries: 12

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  depends_on:
    zookeeper-1: { condition: service_healthy }
    zookeeper-2: { condition: service_healthy }
    zookeeper-3: { condition: service_healthy }
  environment: &kafka-env
    KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
    # Valores por defecto del cluster. Los topicos del sistema los crea kafka-init con su
    # propia configuracion; estos defaults aplican a los que se creen sin indicar nada.
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_NUM_PARTITIONS: 3
    # Con RF=3 y acks=all en los productores, una escritura se confirma cuando al menos 2
    # replicas la tienen: el cluster sigue aceptando escrituras con 1 broker caido.
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_LOG_RETENTION_HOURS: 168
    # Nadie crea topicos "por accidente" (p.ej. con un typo en el nombre): se crean de forma
    # explicita con kafka-init, los NewTopic de cada microservicio o ms-andesstay-kafka-admin.
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_DELETE_TOPIC_ENABLE: "true"
    KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
    KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
  healthcheck:
    test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
    interval: 10s
    timeout: 10s
    retries: 18

services:
  zookeeper-1:
    <<: *zookeeper
    container_name: andesstay-zookeeper-1
    hostname: zookeeper-1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    ports: ["2181:2181"]
    volumes: [zookeeper-1-data:/var/lib/zookeeper/data]

  zookeeper-2:
    <<: *zookeeper
    container_name: andesstay-zookeeper-2
    hostname: zookeeper-2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    ports: ["2182:2181"]
    volumes: [zookeeper-2-data:/var/lib/zookeeper/data]

  zookeeper-3:
    <<: *zookeeper
    container_name: andesstay-zookeeper-3
    hostname: zookeeper-3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    ports: ["2183:2181"]
    volumes: [zookeeper-3-data:/var/lib/zookeeper/data]

  # Cada broker anuncia dos listeners: kafka-N:29092 para los otros contenedores (brokers,
  # kafka-init, kafka-ui) y <host>:909X para los microservicios. <host> es localhost en
  # desarrollo; en la EC2 de infraestructura se levanta con KAFKA_ADVERTISED_HOST=<IP privada>
  # para que las EC2 de aplicacion puedan conectarse (ver aws/kafka-cluster.sh).
  kafka-1:
    <<: *kafka
    container_name: andesstay-kafka-1
    hostname: kafka-1
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:9092
    ports: ["9092:9092"]
    volumes: [kafka-1-data:/var/lib/kafka/data]

  kafka-2:
    <<: *kafka
    container_name: andesstay-kafka-2
    hostname: kafka-2
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:9093
    ports: ["9093:9092"]
    volumes: [kafka-2-data:/var/lib/kafka/data]

  kafka-3:
    <<: *kafka
    container_name: andesstay-kafka-3
    hostname: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:9094
    ports: ["9094:9092"]
    volumes: [kafka-3-data:/var/lib/kafka/data]

  # Crea (o ajusta) los topicos del sistema con su configuracion y termina. Es idempotente:
  # se puede volver a ejecutar con `docker compose -f infra/kafka/compose.yml run --rm kafka-init`.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: andesstay-kafka-init
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    environment:
      BOOTSTRAP: kafka-1:29092,kafka-2:29092,kafka-3:29092
    volumes: ["./scripts:/scripts:ro"]
    entrypoint: ["bash", "/scripts/create-topics.sh"]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: andesstay-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka-1: { condition: service_healthy }
    ports:
      - "8089:8080" # http://localhost:8089
    environment:
      KAFKA_CLUSTERS_0_NAME: andesstay
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      # Permite crear/editar topicos y resetear offsets de consumer groups desde la UI.
      KAFKA_CLUSTERS_0_READONLY: "false"
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  zookeeper-1-data:
  zookeeper-2-data:
  zookeeper-3-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
