name: andesstay-kafka

# Zookeeper + 1 broker Kafka para desarrollo local, tal como pide el caso (no KRaft).
# El caso pide 3 nodos de Zookeeper + 3 brokers para las evaluaciones en EC2 (seccion 7);
# ese compose se arma aparte cuando toque desplegar, no hace falta para probar los
# microservicios en local. Incluye Kafka UI para inspeccionar topicos y mensajes.
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: andesstay-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: andesstay-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # Listener interno (para otros contenedores, p.ej. kafka-ui) vs externo (para los
      # microservicios corriendo en el host apuntando a localhost:9092).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: andesstay-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8089:8080" # http://localhost:8089
    environment:
      KAFKA_CLUSTERS_0_NAME: andesstay
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
